# Development overrides — use ./dev.sh (runs in the foreground, Ctrl+C stops everything).
# Source code is bind-mounted and every service reloads on change:
#   api → uvicorn --reload, worker/scheduler → watchfiles, whatsapp → node --watch, web → Vite dev server (HMR).
# Runs as compose project "soroka-dev", so its database/files are separate from production.
x-backend-dev: &backend-dev
  volumes:
    - files:/data
    - ./backend:/app
  environment:
    COOKIE_SECURE: "false"   # dev is served over plain http

services:
  api:
    <<: *backend-dev
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m soroka.bootstrap && exec uvicorn soroka.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*' --reload --reload-dir soroka"]

  worker:
    <<: *backend-dev
    restart: "no"
    deploy: { replicas: 1 }
    command: ["watchfiles", "--filter", "python", "rq worker --url redis://redis:6379/0 high default low", "soroka"]

  scheduler:
    <<: *backend-dev
    restart: "no"
    command: ["watchfiles", "--filter", "python", "python -m soroka.scheduler", "soroka"]

  whatsapp:
    restart: "no"
    volumes:
      - wa_auth:/app/auth
      - ./connectors/whatsapp:/app
      - wa_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --omit=dev --no-package-lock --no-audit --no-fund && exec node --watch-path=index.js index.js"]

  web:
    build: !reset null
    image: node:20-bookworm-slim
    working_dir: /app
    restart: "no"
    environment:
      API_PROXY: http://api:8000
    ports: !override
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173 --strictPort"]

  db:
    restart: "no"
  redis:
    restart: "no"

volumes:
  web_node_modules:
  wa_node_modules:
